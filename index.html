<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8">

  <title>Landbys Jaktia – Topplista</title>

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <style>
    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      min-height: 100%;
    }

    body {
      background:
        linear-gradient(
          rgba(0, 0, 0, 0.42),
          rgba(0, 0, 0, 0.42)
        ),
        url("bakgrund.jpg") center center / cover no-repeat fixed;

      font-family: Montserrat, Arial, sans-serif;
      margin: 0;
      color: white;
      min-height: 100vh;
      overflow-x: hidden;
    }

    .page {
      width: 100%;
      min-height: 100vh;
      padding: 22px 30px 28px 30px;
      box-sizing: border-box;
    }

    /* =========================
       DATUMVÄLJARE
       ========================= */

    .date-row {
      position: absolute;
      top: 18px;
      left: 22px;
      z-index: 1000;

      font-size: 16px;
      color: white;

      display: flex;
      align-items: center;
      gap: 8px;
    }

    .date-row label {
      font-weight: 700;
    }

    select {
      font-size: 14px;
      padding: 4px 8px;
      border: none;
      border-radius: 0;
    }

    /* =========================
       RUBRIK
       ========================= */

    .top-row {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 40px;
      padding-top: 28px;
    }

    .left-panel {
      flex: 1;
      padding-top: 60px;
    }

    .right-panel {
  width: 430px;
  display: flex;
  justify-content: flex-end;
  align-items: flex-start;
  flex-shrink: 0;
  padding-top: 55px;
}

.logo-img {
  width: 100%;
  max-width: 440px;
  height: auto;
  display: block;
  object-fit: contain;

  mix-blend-mode: multiply;
}

  

h1 {
  font-family: "Montserrat", Arial, sans-serif;
  font-size: clamp(48px, 4.8vw, 76px);
  font-weight: 900;
  line-height: 0.98;
  letter-spacing: -2px;
  text-transform: uppercase;
  margin: 0;
  color: #F2E7D5;
  text-align: left;
}

    /* =========================
       TOPPLISTA
       ========================= */

    .bottom-row {
  margin-top: 90px;
}
.leaderboard-box {
  width: 100%;
  min-height: 420px;

  background: rgba(255, 255, 255, 0.80);
  color: black;

  padding: 22px 28px 24px 28px;
  box-sizing: border-box;
}

    .leaderboard-header {
      display: grid;
      grid-template-columns: 70px 1fr auto;
      align-items: center;
      gap: 12px;
      margin-bottom: 14px;
    }

    .position-title {
      font-size: 20px;
      font-weight: 800;
      text-align: left;
    }

    .name-title {
      font-size: 20px;
      font-weight: 800;
      text-align: left;
    }

    .points-title {
      font-size: 20px;
      font-weight: 800;
      text-align: right;
    }

    table {
      width: 100%;
      border-collapse: collapse;
    }

    thead {
      display: none;
    }

    td {
      padding: 12px 0;
      font-size: 22px;
      vertical-align: middle;
    }

    .position-cell {
      width: 70px;
      text-align: left;
      font-weight: 700;
    }

    .name-cell {
      text-align: left;
      padding-right: 20px;
    }

    .points-cell {
      text-align: right;
      white-space: nowrap;
      font-variant-numeric: tabular-nums;
      font-weight: 700;
    }

    .empty-row td {
      color: #444;
      text-align: left;
    }

    /* =========================
       MINDRE SKÄRMAR
       ========================= */

    @media (max-width: 1200px) {
      .page {
        padding: 20px;
      }

      .top-row {
        flex-direction: column;
      }

      h1 {
        font-size: 70px;
      }

      .bottom-row {
        margin-top: 40px;
        justify-content: flex-start;
      }

      .leaderboard-box {
        width: 100%;
        min-height: 300px;
      }
    }

    /* =========================
       MOBIL
       ========================= */

    @media (max-width: 650px) {
      body {
        /*
         * Fixed background kan fungera dåligt på mobil.
         * Resten är samma som på dator.
         */
        background:
          linear-gradient(
            rgba(0, 0, 0, 0.42),
            rgba(0, 0, 0, 0.42)
          ),
          url("bakgrund.jpg") center center / cover no-repeat;
      }

      .page {
        padding: 18px 12px 28px 12px;
      }

      .date-row {
        position: relative;
        top: auto;
        left: auto;
        margin-bottom: 25px;
      }

      .top-row {
        padding-top: 0;
      }

      .left-panel {
        padding-top: 0;
      }

      h1 {
        font-size: 48px;
        letter-spacing: -1px;
      }

      .bottom-row {
        margin-top: 35px;
      }

      .leaderboard-box {
        padding: 18px;
      }

      .leaderboard-header {
        grid-template-columns: 45px 1fr auto;
        gap: 10px;
      }

      .position-title,
      .name-title,
      .points-title {
        font-size: 18px;
      }

      td {
        font-size: 18px;
        padding: 11px 0;
      }

      .position-cell {
        width: 45px;
      }
    }
  </style>
</head>

<body>
  <div class="page">

    <!-- Datumväljare -->
    <div class="date-row">
      <label for="dateSelect">Datum:</label>
      <select id="dateSelect"></select>
    </div>

    <!-- Rubrik -->
   <div class="top-row">

  <div class="left-panel">
    <h1>
      PROVSKJUT I VÅR<br>
      SKYTTESIMULATOR!
    </h1>
  </div>

  <div class="right-panel">
    <img
      class="logo-img"
      src="landbys-logo.png"
      alt="Landbys Jaktia"
    >
  </div>

</div>

    <!-- Topplista -->
    <div class="bottom-row">

      <div class="leaderboard-box">

        <div class="leaderboard-header">
          <div class="position-title">Plats</div>
          <div class="name-title">Namn</div>
          <div class="points-title">Poäng</div>
        </div>

        <table>
          <tbody id="leaderboard-body"></tbody>
        </table>

      </div>

    </div>

  </div>

  <script>
    // ======= KONSTANTER =======

    const SHEET_ID =
      "1cSFFcWBlVxdjf6l6B2DTpj3gRkcqJ2q6ji7GE2P-P1Q";

    const SHEET_NAME = "Formulärsvar 1";

    const MAX_RESULTS = 10;

    const REFRESH_MS = 3000;

    const GVIZ_URL =
      `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?` +
      `sheet=${encodeURIComponent(SHEET_NAME)}&tqx=out:json`;

    let allResults = [];
    let selectedDate = null;
    let dateSelectEl = null;

    // ======= STARTA SIDAN =======

    document.addEventListener("DOMContentLoaded", () => {
      dateSelectEl = document.getElementById("dateSelect");

      dateSelectEl.addEventListener("change", () => {
        selectedDate = dateSelectEl.value;
        renderForDate(selectedDate);
      });

      loadData();

      setInterval(loadData, REFRESH_MS);
    });

    // ======= HÄMTA DATA FRÅN GOOGLE SHEETS =======

    function loadData() {
      fetch(
        GVIZ_URL + "&t=" + Date.now(),
        {
          cache: "no-store"
        }
      )
        .then(response => {
          if (!response.ok) {
            throw new Error(
              `Google Sheets svarade med status ${response.status}`
            );
          }

          return response.text();
        })
        .then(text => {
          const jsonStart = text.indexOf("{");
          const jsonEnd = text.lastIndexOf("}") + 1;

          if (
            jsonStart === -1 ||
            jsonEnd <= jsonStart
          ) {
            throw new Error(
              "Kunde inte läsa Google Sheets-svaret."
            );
          }

          const jsonText = text.substring(
            jsonStart,
            jsonEnd
          );

          const json = JSON.parse(jsonText);

          const rows = json.table?.rows || [];

          /*
           * Google Sheets:
           *
           * c[0] = Tidsstämpel
           * c[1] = Namn
           * c[2] = Poäng
           * c[3] = Datum
           */

          const parsedResults = rows
            .map(row => {
              const columns = row.c || [];

              const name =
                getCellDisplayValue(
                  columns[1]
                ).trim();

              const pointsText =
                getCellDisplayValue(
                  columns[2]
                ).trim();

              const points =
                parsePoints(pointsText);

              const date =
                getCellDisplayValue(
                  columns[3]
                ).trim();

              return {
                name,
                points,
                date
              };
            })
            .filter(result => {
              return (
                result.name &&
                result.date &&
                Number.isFinite(result.points)
              );
            });

          allResults = parsedResults;

          updateDateSelect();

          if (selectedDate) {
            renderForDate(selectedDate);
          }
        })
        .catch(error => {
          console.error(
            "Fel vid hämtning av resultat:",
            error
          );

          showMessage(
            "Kunde inte hämta resultaten"
          );
        });
    }

    // ======= LÄS CELLVÄRDE =======

    function getCellDisplayValue(cell) {
      if (!cell) {
        return "";
      }

      /*
       * f är det formaterade värdet.
       * Det används exempelvis för datum.
       */

      if (
        cell.f !== undefined &&
        cell.f !== null
      ) {
        return cell.f.toString();
      }

      if (
        cell.v !== undefined &&
        cell.v !== null
      ) {
        return cell.v.toString();
      }

      return "";
    }

    // ======= GÖR OM POÄNG TILL SIFFRA =======

    function parsePoints(value) {
      if (
        value === null ||
        value === undefined
      ) {
        return NaN;
      }

      const cleanedValue = value
        .toString()
        .toLowerCase()
        .replace(/poäng/g, "")
        .replace(/\s/g, "")
        .replace(",", ".")
        .trim();

      return Number(cleanedValue);
    }

    // ======= DATUMVÄLJARE =======

    function updateDateSelect() {
      const dates = [
        ...new Set(
          allResults
            .map(result => result.date)
            .filter(Boolean)
        )
      ];

      dates.sort(compareDates);

      const previousDate = selectedDate;

      dateSelectEl.innerHTML = "";

      if (dates.length === 0) {
        selectedDate = null;

        const option =
          document.createElement("option");

        option.value = "";
        option.textContent = "Inga datum";

        dateSelectEl.appendChild(option);

        showMessage("Inga resultat");

        return;
      }

      dates.forEach(date => {
        const option =
          document.createElement("option");

        option.value = date;
        option.textContent = date;

        dateSelectEl.appendChild(option);
      });

      if (
        previousDate &&
        dates.includes(previousDate)
      ) {
        selectedDate = previousDate;
      } else {
        selectedDate =
          dates[dates.length - 1];
      }

      dateSelectEl.value = selectedDate;
    }

    // ======= SORTERA DATUM =======

    function compareDates(a, b) {
      const dateA = parseDate(a);
      const dateB = parseDate(b);

      if (dateA && dateB) {
        return dateA - dateB;
      }

      return a.localeCompare(
        b,
        "sv",
        {
          numeric: true
        }
      );
    }

    function parseDate(value) {
      const text =
        value.toString().trim();

      /*
       * Exempel:
       * 2026-07-28
       */

      const isoMatch = text.match(
        /^(\d{4})-(\d{1,2})-(\d{1,2})$/
      );

      if (isoMatch) {
        return new Date(
          Number(isoMatch[1]),
          Number(isoMatch[2]) - 1,
          Number(isoMatch[3])
        );
      }

      /*
       * Exempel:
       * 28/07/2026
       * 28.07.2026
       * 28-07-2026
       */

      const swedishMatch = text.match(
        /^(\d{1,2})[\/.-](\d{1,2})[\/.-](\d{4})$/
      );

      if (swedishMatch) {
        return new Date(
          Number(swedishMatch[3]),
          Number(swedishMatch[2]) - 1,
          Number(swedishMatch[1])
        );
      }

      return null;
    }

    // ======= VISA RESULTAT FÖR VALT DATUM =======

    function renderForDate(date) {
      const resultsForDate =
        allResults.filter(result => {
          return result.date === date;
        });

      /*
       * Högst poäng först.
       *
       * Vid samma poäng sorteras namnen
       * i bokstavsordning.
       */

      resultsForDate.sort((a, b) => {
        if (b.points !== a.points) {
          return b.points - a.points;
        }

        return a.name.localeCompare(
          b.name,
          "sv"
        );
      });

      const topResults =
        resultsForDate.slice(
          0,
          MAX_RESULTS
        );

      fillLeaderboard(topResults);
    }

    // ======= SKAPA TOPPLISTAN =======

    function fillLeaderboard(results) {
      const tbody =
        document.getElementById(
          "leaderboard-body"
        );

      tbody.innerHTML = "";

      if (!results.length) {
        showMessage("Inga resultat");
        return;
      }

      results.forEach(
        (result, index) => {
          const position = index + 1;

          const row =
            document.createElement("tr");

          const positionCell =
            document.createElement("td");

          const nameCell =
            document.createElement("td");

          const pointsCell =
            document.createElement("td");

          positionCell.className =
            "position-cell";

          nameCell.className =
            "name-cell";

          pointsCell.className =
            "points-cell";

          positionCell.textContent =
            `${position}.`;

          nameCell.textContent =
            result.name;

          pointsCell.textContent =
            formatPoints(result.points);

          row.appendChild(
            positionCell
          );

          row.appendChild(
            nameCell
          );

          row.appendChild(
            pointsCell
          );

          tbody.appendChild(row);
        }
      );
    }

    // ======= FORMATERA POÄNG =======

    function formatPoints(points) {
      return points.toLocaleString(
        "sv-SE",
        {
          maximumFractionDigits: 2
        }
      );
    }

    // ======= VISA MEDDELANDE =======

    function showMessage(message) {
      const tbody =
        document.getElementById(
          "leaderboard-body"
        );

      tbody.innerHTML = `
        <tr class="empty-row">
          <td colspan="3">${message}</td>
        </tr>
      `;
    }
  </script>
</body>
</html>
